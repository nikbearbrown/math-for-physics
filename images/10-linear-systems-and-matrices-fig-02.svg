<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The determinant decides whether two lines cross</title>
  <desc id="desc">Two panels. Left: a nonzero determinant, the coefficient-row arrows span a parallelogram of nonzero area and the two lines cross once, giving one solution. Right: a zero determinant, the row arrows are collinear so the parallelogram collapses to zero area and the two lines are parallel, giving no solution.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">The determinant is the area that decides whether the lines cross</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">det A is the signed area spanned by the coefficient rows; zero area means parallel lines and no unique solution.</text>

  <!-- ===== LEFT PANEL: det != 0 ===== -->
  <text x="170" y="86" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">DET A &#8800; 0 &#8212; ONE SOLUTION</text>
  <!-- axes: origin at (170, 300); x right to 320, y up to 110 -->
  <line x1="60" y1="300" x2="330" y2="300" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="320" x2="170" y2="100" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="334" y="304" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x</text>
  <text x="164" y="96" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">y</text>

  <!-- parallelogram from two row vectors r1=(3,1)->(170+3*30,300-1*30)=(260,270) and r2=(1,2.5)->(200,225). 4th pt = r1+r2 = (4,3.5)->(290,195) -->
  <polygon points="170,300 260,270 290,195 200,225" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="170" y1="300" x2="260" y2="270" stroke="#6B3520" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="300" x2="200" y2="225" stroke="#6B3520" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="290" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#6B3520">row 1</text>
  <text x="150" y="250" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#6B3520">row 2</text>
  <text x="232" y="232" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">area &gt; 0</text>

  <!-- the two lines crossing once, drawn lower-right small inset overlay -->
  <line x1="100" y1="160" x2="300" y2="290" stroke="#2a1a0e" stroke-width="1.6"/>
  <line x1="110" y1="285" x2="300" y2="140" stroke="#C8102E" stroke-width="1.6"/>
  <!-- crossing approx intersection of those two segments ~ (205,217) -->
  <circle cx="207" cy="216" r="5" fill="#C8102E"/>
  <text x="214" y="208" font-family="'EB Garamond', Georgia, serif" font-size="10" font-weight="bold" fill="#C8102E">cross</text>

  <!-- ===== RIGHT PANEL: det = 0 ===== -->
  <text x="525" y="86" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">DET A = 0 &#8212; NO SOLUTION</text>
  <line x1="415" y1="300" x2="685" y2="300" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="525" y1="320" x2="525" y2="100" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="689" y="304" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x</text>
  <text x="519" y="96" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">y</text>

  <!-- collinear row vectors: r1=(3,1.5)->(615,255) and r2=(2,1)->(585,270). same direction; parallelogram collapses to a line -->
  <line x1="525" y1="300" x2="615" y2="255" stroke="#6B3520" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="300" x2="585" y2="270" stroke="#C8102E" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="600" y="248" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#6B3520">rows collinear</text>
  <text x="575" y="290" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">area = 0</text>

  <!-- two parallel lines -->
  <line x1="445" y1="160" x2="660" y2="270" stroke="#2a1a0e" stroke-width="1.6"/>
  <line x1="445" y1="130" x2="660" y2="240" stroke="#C8102E" stroke-width="1.6"/>
  <text x="560" y="155" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">never meet</text>

  <text x="350" y="395" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Nonzero area: the lines cross at one point. Zero area: parallel lines, no unique solution.</text>
</svg>
