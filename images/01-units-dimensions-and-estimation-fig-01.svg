<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional homogeneity as an error check</title>
  <desc id="desc">Two candidate kinematic equations checked dimension by dimension: s equals one-half a t squared is consistent (both sides length L); s equals one-half a t is impossible (right side is a speed, L T to the minus one).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">A dimensionally inconsistent equation is certainly wrong</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Tracking the base dimensions L, M, T through each side. Both sides must share a dimension for the equation to be allowed.</text>

  <!-- target -->
  <text x="32" y="92" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">TARGET DIMENSION   [s] = L  (a length)</text>

  <!-- LEFT panel: consistent -->
  <rect x="32" y="112" width="300" height="240" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="182" y="138" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">CANDIDATE A</text>
  <text x="182" y="166" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="15" fill="#2a1a0e">s = ½ a t²</text>
  <line x1="56" y1="182" x2="308" y2="182" stroke="#D4D4D4" stroke-width="1"/>
  <text x="56" y="208" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[a] = L T⁻²</text>
  <text x="56" y="230" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[t²] = T²</text>
  <text x="56" y="256" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[a][t²] = L T⁻² · T² = L</text>
  <line x1="56" y1="276" x2="308" y2="276" stroke="#D4D4D4" stroke-width="1"/>
  <text x="56" y="302" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">L  =  L</text>
  <text x="182" y="332" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#6B3520">CONSISTENT — allowed</text>

  <!-- RIGHT panel: wrong -->
  <rect x="368" y="112" width="300" height="240" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="518" y="138" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">CANDIDATE B</text>
  <text x="518" y="166" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="15" fill="#2a1a0e">s = ½ a t</text>
  <line x1="392" y1="182" x2="644" y2="182" stroke="#D4D4D4" stroke-width="1"/>
  <text x="392" y="208" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[a] = L T⁻²</text>
  <text x="392" y="230" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[t] = T</text>
  <text x="392" y="256" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">[a][t] = L T⁻² · T = L T⁻¹</text>
  <line x1="392" y1="276" x2="644" y2="276" stroke="#D4D4D4" stroke-width="1"/>
  <text x="392" y="302" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#C8102E">L  ≠  L T⁻¹  (a speed)</text>
  <text x="518" y="332" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#C8102E">IMPOSSIBLE — certainly wrong</text>

  <text x="350" y="384" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">Consistency is necessary, not sufficient: it cannot confirm the ½, but it can never miss a dimensional error.</text>
</svg>
