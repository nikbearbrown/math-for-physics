<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A power amplifies relative uncertainty</title>
  <desc id="desc">A sphere's diameter measured to 1.9 percent relative uncertainty gives a volume, which depends on the cube of the diameter, with three times the relative uncertainty: 5.8 percent.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">A cube triples the imprecision of its input</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">For V = (π/6) d³, the relative uncertainty in V is three times that in d — the exponent 3 multiplies the relative error.</text>

  <text x="32" y="92" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">MEASURED   d = 5.2 ± 0.1 cm        RULE   δV/V = 3 · δd/d</text>

  <!-- bar chart: relative uncertainty -->
  <!-- axis -->
  <line x1="120" y1="130" x2="120" y2="300" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="120" y1="300" x2="620" y2="300" stroke="#2a1a0e" stroke-width="1"/>
  <text x="100" y="305" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#545454">0%</text>
  <!-- gridline at 6% -->
  <line x1="120" y1="160" x2="620" y2="160" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="3 3"/>
  <text x="100" y="164" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#545454">6%</text>
  <line x1="120" y1="230" x2="620" y2="230" stroke="#D4D4D4" stroke-width="0.75" stroke-dasharray="3 3"/>
  <text x="100" y="234" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" fill="#545454">3%</text>

  <!-- scale: 6% = 140px tall (300 - 160), so 1% = 23.33px -->
  <!-- diameter bar: 1.9% -> 44px -->
  <rect x="200" y="256" width="90" height="44" fill="#6B3520"/>
  <text x="245" y="320" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">δd/d</text>
  <text x="245" y="248" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">1.9%</text>

  <!-- volume bar: 5.8% -> 135px -->
  <rect x="430" y="165" width="90" height="135" fill="#C8102E"/>
  <text x="475" y="320" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">δV/V</text>
  <text x="475" y="156" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">5.8%</text>

  <!-- x3 annotation -->
  <line x1="295" y1="278" x2="425" y2="232" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="360" y="244" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#C8102E">× 3</text>

  <text x="350" y="366" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">V = 73.6 ± 4.3 cm³. The 1.9% input error becomes a 5.8% output error — the power, not the arithmetic, sets the danger.</text>
</svg>
