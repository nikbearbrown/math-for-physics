<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tip-to-tail vector addition: the pilot and the wind</title>
  <desc id="desc">The plane's airspeed vector toward the northeast and the wind vector toward the southeast are added tip to tail on east-north axes. The resultant ground velocity points about 33 degrees north of east at about 123 knots — not where the nose points.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8102E"/>
    </marker>
    <marker id="arrowbr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B3520"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Velocities add as arrows, component by component</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Adding magnitudes (120 + 25) is meaningless; sliding the wind tip-to-tail onto the airspeed gives the true ground velocity.</text>

  <!-- axes: origin at (90,330) -->
  <line x1="90" y1="330" x2="500" y2="330" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="90" y1="340" x2="90" y2="90" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="506" y="334" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">East (î)</text>
  <text x="70" y="96" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">North (ĵ)</text>

  <!-- scale: 1 knot = 2 px. airspeed 84.9,84.9 -> (90+170, 330-170)=(260,160) -->
  <line x1="90" y1="330" x2="260" y2="160" stroke="#6B3520" stroke-width="2" marker-end="url(#arrowbr)"/>
  <text x="150" y="232" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#6B3520">airspeed 120 kn (NE)</text>

  <!-- wind tip-to-tail from (260,160): wind 17.7,-17.7 -> +35,+35 -> (295,195) -->
  <line x1="260" y1="160" x2="295" y2="195" stroke="#C8102E" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="300" y="180" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">wind 25 kn</text>
  <text x="300" y="196" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">(toward SE)</text>

  <!-- resultant from origin to (295,195): 102.6,67.2 -> 90+205.2=295.2, 330-134.4=195.6 -->
  <line x1="90" y1="330" x2="295" y2="195" stroke="#2a1a0e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="290" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#2a1a0e">ground velocity</text>

  <!-- heading angle arc at origin -->
  <path d="M 150 330 A 60 60 0 0 0 144 306" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="158" y="320" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">33°</text>

  <!-- result panel -->
  <rect x="520" y="130" width="148" height="190" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="536" y="156" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">COMPONENTS</text>
  <text x="536" y="184" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">vₓ = 84.9 + 17.7</text>
  <text x="566" y="202" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">= 102.6</text>
  <text x="536" y="226" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">v_y = 84.9 − 17.7</text>
  <text x="566" y="244" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">= 67.2</text>
  <line x1="536" y1="258" x2="652" y2="258" stroke="#D4D4D4" stroke-width="1"/>
  <text x="536" y="284" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">|v| ≈ 123 kn</text>
  <text x="536" y="306" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#C8102E">heading ≈ 33° N of E</text>

  <text x="350" y="396" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">Not the 45° the nose points, and not 120 kn. Miss the vector addition and you miss the island.</text>
</svg>
