<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A square wave built from summed Fourier sine terms</title>
  <desc id="desc">The dashed target square wave with three Fourier partial sums over one period: one term is a lone sine, two terms begins to flatten the top, three terms squares up the corners. Adding successive odd harmonics converges toward the square wave, with a small persistent overshoot at the jumps known as the Gibbs phenomenon.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="34" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Building a square wave from pure sines</text>
  <text x="32" y="52" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">y = (4/&#960;)[sin &#969;&#8320;t + &#8531;&#8201;sin 3&#969;&#8320;t + &#8533;&#8201;sin 5&#969;&#8320;t + &#8943;] &#8212; each added odd harmonic squares up the shape.</text>

  <!-- axes: zero line py200, t axis px110.. , left axis px110 -->
  <line x1="90" y1="200" x2="668" y2="200" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="110" y1="335" x2="110" y2="95" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="670" y="216" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">t</text>
  <text x="102" y="98" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">y</text>
  <line x1="106" y1="115" x2="114" y2="115" stroke="#2a1a0e" stroke-width="1"/>
  <text x="102" y="119" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">+1</text>
  <line x1="106" y1="285" x2="114" y2="285" stroke="#2a1a0e" stroke-width="1"/>
  <text x="100" y="289" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">&#8722;1</text>
  <text x="650" y="216" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">T</text>

  <!-- target square wave (dashed ink): +1 (py115) for 0..pi (px110..380), -1 (py285) for pi..2pi (px380..650) -->
  <polyline fill="none" stroke="#2a1a0e" stroke-width="1.3" stroke-dasharray="5 3" points="110,115 380,115 380,285 650,285"/>

  <!-- 1-term (brown) subsampled -->
  <polyline fill="none" stroke="#6B3520" stroke-width="1.5" points="110,200 132.5,172 155,145.9 177.5,123.5 200,106.3 222.5,95.5 245,91.8 267.5,95.5 290,106.3 312.5,123.5 335,145.9 357.5,172 380,200 402.5,228 425,254.1 447.5,276.5 470,293.7 492.5,304.5 515,308.2 537.5,304.5 560,293.7 582.5,276.5 605,254.1 627.5,228 650,200"/>
  <text x="246" y="106" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#6B3520">1 term</text>

  <!-- 2-term (grey) subsampled -->
  <polyline fill="none" stroke="#545454" stroke-width="1.5" points="110,200 132.5,146.5 155,109.8 177.5,98 200,106.3 222.5,121 245,127.8 267.5,121 290,106.3 312.5,98 335,109.8 357.5,146.5 380,200 402.5,253.5 425,290.2 447.5,302 470,293.7 492.5,279 515,272.2 537.5,279 560,293.7 582.5,302 605,290.2 627.5,253.5 650,200"/>
  <text x="200" y="143" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#545454">2 terms</text>

  <!-- 3-term (red) finer -->
  <polyline fill="none" stroke="#C8102E" stroke-width="2" points="110,200 121.2,158.9 132.5,125.6 143.8,105.3 155,99 166.2,103.6 177.5,113.3 188.8,121.8 200,125 211.2,122.1 222.5,115.4 233.8,108.9 245,106.2 256.2,108.9 267.5,115.4 278.8,122.1 290,125 301.2,121.8 312.5,113.3 323.8,103.6 335,99 346.2,105.3 357.5,125.6 368.8,158.9 380,200 391.2,241.1 402.5,274.4 413.8,294.7 425,301 436.2,296.4 447.5,286.7 458.8,278.2 470,275 481.2,277.9 492.5,284.6 503.8,291.1 515,293.8 526.2,291.1 537.5,284.6 548.8,277.9 560,275 571.2,278.2 582.5,286.7 593.8,296.4 605,301 616.2,294.7 627.5,274.4 638.8,241.1 650,200"/>
  <text x="335" y="200" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" font-weight="bold" fill="#C8102E">3 terms</text>

  <!-- Gibbs note near jump at px380 -->
  <text x="430" y="305" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#545454">Gibbs overshoot persists at the jump &#8593;</text>

  <text x="350" y="402" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">More harmonics sharpen the corners &#8212; the same recipe of amplitudes that makes a clarinet differ from a violin.</text>
</svg>
