<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The sliding criterion tan theta greater than mu</title>
  <desc id="desc">A block on a ramp at angle theta: dividing out the mass gives acceleration a equals g times (sin theta minus mu cos theta); the block slips precisely when tan theta exceeds the friction coefficient mu, at the critical angle theta equals arctan mu.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">The mass cancels; a clean slip condition drops out</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">From a = g(sin θ − μ cos θ), the block accelerates only when sin θ &gt; μ cos θ, i.e. tan θ &gt; μ.</text>

  <!-- ramp -->
  <polygon points="80,320 420,320 80,180" fill="#F5EFE8" stroke="#2a1a0e" stroke-width="1.2"/>
  <!-- angle marker -->
  <path d="M 380 320 A 40 40 0 0 0 365 305" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="358" y="312" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" fill="#2a1a0e">θ</text>

  <!-- block on ramp -->
  <g transform="translate(220,232) rotate(-22.4)">
    <rect x="-26" y="-22" width="52" height="40" fill="#6B3520"/>
  </g>

  <!-- driving component (down slope) -->
  <line x1="222" y1="240" x2="282" y2="265" stroke="#C8102E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="276" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">mg sin θ (drives)</text>
  <!-- friction component (up slope) -->
  <line x1="222" y1="240" x2="172" y2="219" stroke="#545454" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="208" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">μmg cos θ (resists)</text>

  <!-- threshold inset -->
  <rect x="450" y="120" width="218" height="220" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="466" y="146" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">SLIP THRESHOLD</text>

  <text x="466" y="178" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">tan θ &lt; μ</text>
  <line x1="560" y1="174" x2="592" y2="174" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="604" y="178" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">stays put</text>

  <text x="466" y="214" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">tan θ = μ</text>
  <line x1="560" y1="210" x2="592" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="604" y="214" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">on verge</text>

  <text x="466" y="250" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#C8102E">tan θ &gt; μ</text>
  <line x1="560" y1="246" x2="592" y2="246" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="604" y="250" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">slides</text>

  <line x1="466" y1="272" x2="652" y2="272" stroke="#D4D4D4" stroke-width="1"/>
  <text x="466" y="300" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">critical angle</text>
  <text x="466" y="324" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="14" fill="#2a1a0e">θ_c = arctan μ</text>

  <text x="350" y="372" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">The slip criterion is invisible in any numerical answer; the symbolic solution hands it to you directly.</text>
</svg>
