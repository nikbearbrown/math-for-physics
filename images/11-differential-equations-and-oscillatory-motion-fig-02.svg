<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three regimes of the damped oscillator</title>
  <desc id="desc">Displacement versus time for a damped oscillator released from the same starting displacement. The underdamped case oscillates inside a decaying envelope and crosses zero several times; the critically damped case returns to zero quickly without overshoot; the overdamped case returns slowly without overshoot.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="34" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Three regimes set by the discriminant b&#178; &#8722; 4mk</text>
  <text x="32" y="52" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Same release, same equilibrium &#8212; only the damping differs. The sign of b&#178; &#8722; 4mk decides whether it overshoots.</text>

  <!-- axes: t at py210, x at px100 -->
  <line x1="100" y1="210" x2="660" y2="210" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="350" x2="100" y2="70" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="226" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">t</text>
  <text x="92" y="68" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x(t)</text>
  <text x="92" y="82" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">x&#8320;</text>

  <!-- decay envelope around underdamped (faint dashed) trimmed -->
  <polyline fill="none" stroke="#C8102E" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.55" points="100.0,75.0 116.2,92.0 132.4,106.9 148.6,119.9 164.8,131.3 181.0,141.2 197.2,149.9 213.4,157.5 229.6,164.1 245.8,169.9 262.0,175.0 278.2,179.4 294.4,183.3 310.6,186.6 326.8,189.6 343.0,192.2 359.2,194.4 375.4,196.4 391.6,198.1 407.8,199.6 424.0,200.9 440.2,202.1 456.4,203.1 472.6,203.9 488.8,204.7 505.0,205.4 521.2,206.0 537.4,206.5 553.6,206.9 569.8,207.3 586.0,207.6 602.2,207.9 618.4,208.2 634.6,208.4 640.0,208.5"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.55" points="100.0,345.0 116.2,328.0 132.4,313.1 148.6,300.1 164.8,288.7 181.0,278.8 197.2,270.1 213.4,262.5 229.6,255.9 245.8,250.1 262.0,245.0 278.2,240.6 294.4,236.7 310.6,233.4 326.8,230.4 343.0,227.8 359.2,225.6 375.4,223.6 391.6,221.9 407.8,220.4 424.0,219.1 440.2,217.9 456.4,216.9 472.6,216.1 488.8,215.3 505.0,214.6 521.2,214.0 537.4,213.5 553.6,213.1 569.8,212.7 586.0,212.4 602.2,212.1 618.4,211.8 634.6,211.6 640.0,211.5"/>

  <!-- UNDERDAMPED (red) -->
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="100.0,80.0 105.4,81.7 110.8,86.7 116.2,94.5 121.6,104.7 127.0,116.7 132.4,130.2 137.8,144.6 143.2,159.6 148.6,174.5 154.0,189.1 159.4,203.0 164.8,215.9 170.2,227.5 175.6,237.7 181.0,246.2 186.4,253.1 191.8,258.2 197.2,261.7 202.6,263.4 208.0,263.6 213.4,262.4 218.8,259.9 224.2,256.3 229.6,251.8 235.0,246.6 240.4,240.8 245.8,234.8 251.2,228.6 256.6,222.4 262.0,216.5 267.4,210.9 272.8,205.7 278.2,201.2 283.6,197.2 289.0,193.9 294.4,191.3 299.8,189.5 305.2,188.3 310.6,187.8 316.0,188.0 321.4,188.7 326.8,189.9 332.2,191.5 337.6,193.5 343.0,195.7 348.4,198.2 353.8,200.7 359.2,203.3 364.6,205.8 370.0,208.2 375.4,210.4 380.8,212.5 386.2,214.3 391.6,215.8 397.0,217.1 402.4,218.0 407.8,218.7 413.2,219.1 418.6,219.2 424.0,219.0 429.4,218.7 434.8,218.1 440.2,217.4 445.6,216.5 451.0,215.5 456.4,214.5 461.8,213.5 467.2,212.4 472.6,211.4 478.0,210.4 483.4,209.5 488.8,208.7 494.2,208.0 499.6,207.4 505.0,206.9 510.4,206.6 515.8,206.3 521.2,206.2 526.6,206.2 532.0,206.3 537.4,206.5 542.8,206.8 548.2,207.1 553.6,207.5 559.0,207.9 564.4,208.3 569.8,208.7 575.2,209.2 580.6,209.6 586.0,210.0 591.4,210.3 596.8,210.7 602.2,210.9 607.6,211.2 613.0,211.3 618.4,211.5 623.8,211.5 629.2,211.6 634.6,211.6 640.0,211.5"/>

  <!-- CRITICALLY DAMPED (ink) -->
  <polyline fill="none" stroke="#2a1a0e" stroke-width="2" points="100.0,80.0 110.8,84.2 121.6,94.2 132.4,106.7 143.2,120.1 154.0,133.1 164.8,145.1 175.6,155.8 186.4,165.2 197.2,173.2 208.0,180.0 218.8,185.6 229.6,190.3 240.4,194.2 251.2,197.3 262.0,199.9 272.8,201.9 283.6,203.6 294.4,204.9 305.2,206.0 316.0,206.8 326.8,207.5 337.6,208.0 348.4,208.5 359.2,208.8 370.0,209.1 380.8,209.3 391.6,209.4 402.4,209.5 413.2,209.6 424.0,209.7 434.8,209.8 445.6,209.8 456.4,209.9 467.2,209.9 478.0,209.9 488.8,209.9 499.6,210.0 510.4,210.0 521.2,210.0 532.0,210.0 542.8,210.0 553.6,210.0 564.4,210.0 575.2,210.0 586.0,210.0 596.8,210.0 607.6,210.0 618.4,210.0 629.2,210.0 640.0,210.0"/>

  <!-- OVERDAMPED (brown) -->
  <polyline fill="none" stroke="#6B3520" stroke-width="2" points="100.0,80.0 110.8,81.7 121.6,85.8 132.4,91.3 143.2,97.4 154.0,103.8 164.8,110.2 175.6,116.4 186.4,122.4 197.2,128.1 208.0,133.5 218.8,138.6 229.6,143.4 240.4,147.9 251.2,152.0 262.0,155.9 272.8,159.6 283.6,163.0 294.4,166.2 305.2,169.1 316.0,171.9 326.8,174.5 337.6,176.9 348.4,179.1 359.2,181.2 370.0,183.1 380.8,185.0 391.6,186.6 402.4,188.2 413.2,189.7 424.0,191.1 434.8,192.3 445.6,193.5 456.4,194.7 467.2,195.7 478.0,196.7 488.8,197.6 499.6,198.4 510.4,199.2 521.2,199.9 532.0,200.6 542.8,201.2 553.6,201.8 564.4,202.4 575.2,202.9 586.0,203.4 596.8,203.8 607.6,204.2 618.4,204.6 629.2,205.0 640.0,205.3"/>

  <!-- legend -->
  <g font-family="'EB Garamond', Georgia, serif" font-size="11">
    <line x1="430" y1="95" x2="458" y2="95" stroke="#C8102E" stroke-width="2.2"/>
    <text x="464" y="99" fill="#2a1a0e">underdamped &#160;(b&#178; &lt; 4mk)</text>
    <line x1="430" y1="115" x2="458" y2="115" stroke="#2a1a0e" stroke-width="2"/>
    <text x="464" y="119" fill="#2a1a0e">critically damped &#160;(b&#178; = 4mk)</text>
    <line x1="430" y1="135" x2="458" y2="135" stroke="#6B3520" stroke-width="2"/>
    <text x="464" y="139" fill="#2a1a0e">overdamped &#160;(b&#178; &gt; 4mk)</text>
  </g>

  <text x="350" y="398" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Complex roots oscillate inside a decaying envelope; real roots return without crossing zero.</text>
</svg>
