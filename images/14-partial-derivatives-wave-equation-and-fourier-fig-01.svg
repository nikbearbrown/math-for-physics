<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Standing-wave modes of a string fixed at both ends</title>
  <desc id="desc">Three stacked panels showing the first three standing-wave modes of a string pinned at both ends. The fundamental n equals one is a single arch; n equals two has one interior node; n equals three has two interior nodes. Allowed frequencies are integer multiples of the fundamental, f sub n equals n v over two L.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="34" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Standing-wave modes of a string fixed at both ends</text>
  <text x="32" y="52" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Nodes are forced at the ends, so only &#955;&#8345; = 2L/n survive &#8212; frequencies f&#8345; = nv/2L, integer multiples of the fundamental.</text>

  <!-- common end-walls at x=130 and x=610 (hatched) -->
  <g stroke="#2a1a0e" stroke-width="1.2">
    <line x1="124" y1="90" x2="124" y2="370"/>
    <line x1="616" y1="90" x2="616" y2="370"/>
  </g>

  <!-- ===== n=1, center py130 ===== -->
  <line x1="130" y1="130" x2="610" y2="130" stroke="#D4D4D4" stroke-width="1"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="130.0,130.0 149.2,126.0 178.0,120.1 211.6,113.7 245.2,108.1 278.8,103.5 312.4,100.2 350.8,98.3 370.0,98.0 408.4,99.0 442.0,101.5 475.6,105.3 509.2,110.4 542.8,116.4 576.4,123.0 610.0,130.0"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" points="130.0,130.0 149.2,134.0 178.0,139.9 211.6,146.3 245.2,151.9 278.8,156.5 312.4,159.8 350.8,161.7 370.0,162.0 408.4,161.0 442.0,158.5 475.6,154.7 509.2,149.6 542.8,143.6 576.4,137.0 610.0,130.0"/>
  <circle cx="130" cy="130" r="3" fill="#2a1a0e"/><circle cx="610" cy="130" r="3" fill="#2a1a0e"/>
  <text x="640" y="118" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">n = 1</text>
  <text x="640" y="134" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#545454">f&#8321; = v/2L</text>
  <text x="370" y="116" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#545454">ANTINODE</text>

  <!-- ===== n=2, center py230 ===== -->
  <line x1="130" y1="230" x2="610" y2="230" stroke="#D4D4D4" stroke-width="1"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="130.0,230.0 154.0,220.1 187.6,208.1 226.0,199.6 250.0,198.0 278.8,200.2 312.4,208.1 346.0,220.1 370.0,230.0 398.8,241.8 432.4,253.3 466.0,260.4 490.0,262.0 518.8,259.8 552.4,251.9 586.0,239.9 610.0,230.0"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" points="130.0,230.0 154.0,239.9 187.6,251.9 226.0,260.4 250.0,262.0 278.8,259.8 312.4,251.9 346.0,239.9 370.0,230.0 398.8,218.2 432.4,206.7 466.0,199.6 490.0,198.0 518.8,200.2 552.4,208.1 586.0,220.1 610.0,230.0"/>
  <circle cx="130" cy="230" r="3" fill="#2a1a0e"/><circle cx="610" cy="230" r="3" fill="#2a1a0e"/>
  <circle cx="370" cy="230" r="3.5" fill="#6B3520"/>
  <text x="370" y="246" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6B3520">NODE</text>
  <text x="640" y="218" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">n = 2</text>
  <text x="640" y="234" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#545454">f&#8322; = 2f&#8321;</text>

  <!-- ===== n=3, center py330 ===== -->
  <line x1="130" y1="330" x2="610" y2="330" stroke="#D4D4D4" stroke-width="1"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="130.0,330.0 154.0,315.5 187.6,301.0 211.6,298.0 245.2,305.3 278.8,323.0 302.8,338.0 336.4,355.3 370.0,362.0 403.6,355.3 437.2,338.0 461.2,323.0 494.8,305.3 528.4,298.0 562.0,304.1 595.6,321.1 610.0,330.0"/>
  <polyline fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" points="130.0,330.0 154.0,344.5 187.6,359.0 211.6,362.0 245.2,354.7 278.8,337.0 302.8,322.0 336.4,304.7 370.0,298.0 403.6,304.7 437.2,322.0 461.2,337.0 494.8,354.7 528.4,362.0 562.0,355.9 595.6,338.9 610.0,330.0"/>
  <circle cx="130" cy="330" r="3" fill="#2a1a0e"/><circle cx="610" cy="330" r="3" fill="#2a1a0e"/>
  <circle cx="290" cy="330" r="3.5" fill="#6B3520"/><circle cx="450" cy="330" r="3.5" fill="#6B3520"/>
  <text x="640" y="318" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">n = 3</text>
  <text x="640" y="334" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#545454">f&#8323; = 3f&#8321;</text>

  <!-- x labels for ends -->
  <text x="124" y="384" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">x = 0</text>
  <text x="616" y="384" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">x = L</text>

  <text x="350" y="406" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Each mode has n&#8722;1 interior nodes. The string sounds a definite pitch because only these modes fit.</text>
</svg>
