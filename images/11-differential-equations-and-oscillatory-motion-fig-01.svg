<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The simple-harmonic solution x of t equals A cosine omega t</title>
  <desc id="desc">A cosine curve of displacement versus time, released from the far point at rest. The amplitude A is marked as the height from the time axis to a peak, and the period T is marked as the horizontal distance between two successive peaks. Dashed lines bound the motion at plus and minus A.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">The harmonic solution x(t) = A cos(&#969;t)</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Released from rest at the far point: amplitude A is the reach, period T = 2&#960;/&#969; is the time to repeat (independent of A).</text>

  <!-- bound lines at +A (py130) and -A (py330), zero at py230 -->
  <line x1="100" y1="130" x2="640" y2="130" stroke="#D4D4D4" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="330" x2="640" y2="330" stroke="#D4D4D4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="84" y="134" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">+A</text>
  <text x="84" y="334" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">&#8722;A</text>

  <!-- axes: t axis at py230 ; x axis at px100 -->
  <line x1="100" y1="230" x2="660" y2="230" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="345" x2="100" y2="105" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="246" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">t</text>
  <text x="92" y="102" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x(t)</text>

  <!-- cosine curve (red accent) -->
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="100.0,130.0 104.5,130.8 109.0,133.1 113.5,137.0 118.0,142.4 122.5,149.1 127.0,157.1 131.5,166.3 136.0,176.4 140.5,187.4 145.0,199.1 149.5,211.3 154.0,223.7 158.5,236.3 163.0,248.7 167.5,260.9 172.0,272.6 176.5,283.6 181.0,293.7 185.5,302.9 190.0,310.9 194.5,317.6 199.0,323.0 203.5,326.9 208.0,329.2 212.5,330.0 217.0,329.2 221.5,326.9 226.0,323.0 230.5,317.6 235.0,310.9 239.5,302.9 244.0,293.7 248.5,283.6 253.0,272.6 257.5,260.9 262.0,248.7 266.5,236.3 271.0,223.7 275.5,211.3 280.0,199.1 284.5,187.4 289.0,176.4 293.5,166.3 298.0,157.1 302.5,149.1 307.0,142.4 311.5,137.0 316.0,133.1 320.5,130.8 325.0,130.0 329.5,130.8 334.0,133.1 338.5,137.0 343.0,142.4 347.5,149.1 352.0,157.1 356.5,166.3 361.0,176.4 365.5,187.4 370.0,199.1 374.5,211.3 379.0,223.7 383.5,236.3 388.0,248.7 392.5,260.9 397.0,272.6 401.5,283.6 406.0,293.7 410.5,302.9 415.0,310.9 419.5,317.6 424.0,323.0 428.5,326.9 433.0,329.2 437.5,330.0 442.0,329.2 446.5,326.9 451.0,323.0 455.5,317.6 460.0,310.9 464.5,302.9 469.0,293.7 473.5,283.6 478.0,272.6 482.5,260.9 487.0,248.7 491.5,236.3 496.0,223.7 500.5,211.3 505.0,199.1 509.5,187.4 514.0,176.4 518.5,166.3 523.0,157.1 527.5,149.1 532.0,142.4 536.5,137.0 541.0,133.1 545.5,130.8 550.0,130.0 554.5,130.8 559.0,133.1 563.5,137.0 568.0,142.4 572.5,149.1 577.0,157.1 581.5,166.3 586.0,176.4 590.5,187.4 595.0,199.1 599.5,211.3 604.0,223.7 608.5,236.3 613.0,248.7 617.5,260.9 622.0,272.6 626.5,283.6 631.0,293.7 635.5,302.9 640.0,310.9"/>

  <!-- amplitude bracket A: from t-axis(py230) up to peak at px100 -->
  <line x1="130" y1="230" x2="130" y2="130" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="126" y1="130" x2="134" y2="130" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="126" y1="230" x2="134" y2="230" stroke="#2a1a0e" stroke-width="1"/>
  <text x="138" y="184" font-family="'EB Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#2a1a0e">A</text>

  <!-- period bracket T: between peaks at px325 and px550, drawn near top at py118 -->
  <line x1="325" y1="118" x2="550" y2="118" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="325" y1="114" x2="325" y2="126" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="550" y1="114" x2="550" y2="126" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="325" y1="118" x2="325" y2="130" stroke="#545454" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="550" y1="118" x2="550" y2="130" stroke="#545454" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="437" y="112" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#2a1a0e">T = 2&#960;/&#969;</text>

  <text x="350" y="395" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">The reach is set by the release; the period is set by &#969; alone &#8212; not by how far you pull it.</text>
</svg>
