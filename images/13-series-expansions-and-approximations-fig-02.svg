<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The small-angle approximation sine theta approximately theta and its shrinking error</title>
  <desc id="desc">Over a small range of angles the line y equals theta and the curve y equals sine theta nearly coincide near the origin; the vertical gap between them widens as the angle grows. The gap is the dropped cubic term, about theta cubed over six, so the relative error grows like theta squared over six: about one percent at fifteen degrees and a tenth of a percent at five degrees.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Why &#8220;small angle&#8221; works: sin&#952; &#8776; &#952;, with the error attached</text>
  <text x="32" y="54" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The line y = &#952; and the curve y = sin&#952; split apart slowly; the gap is the dropped term &#8776; &#952;&#179;/6.</text>

  <!-- axes: y=0 at py340, theta=0 at px120 -->
  <line x1="120" y1="340" x2="640" y2="340" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="355" x2="120" y2="90" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="644" y="344" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">&#952;</text>
  <text x="640" y="358" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">(radians)</text>
  <text x="112" y="92" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">y</text>

  <!-- degree ticks -->
  <line x1="184.5" y1="336" x2="184.5" y2="344" stroke="#2a1a0e" stroke-width="1"/>
  <text x="184.5" y="356" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">5&#176;</text>
  <line x1="313.5" y1="336" x2="313.5" y2="344" stroke="#2a1a0e" stroke-width="1"/>
  <text x="313.5" y="356" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">15&#176;</text>
  <line x1="507" y1="336" x2="507" y2="344" stroke="#2a1a0e" stroke-width="1"/>
  <text x="507" y="356" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">30&#176;</text>

  <!-- line y=theta (red) -->
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="120.0,340.0 156.9,322.0 193.8,304.0 230.8,286.0 267.7,268.0 304.6,250.0 341.5,232.0 378.5,214.0 415.4,196.0 452.3,178.0 489.2,160.0 526.2,142.0 563.1,124.0 600.0,106.0"/>
  <text x="606" y="104" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#C8102E">y = &#952;</text>

  <!-- curve y=sin theta (ink) -->
  <polyline fill="none" stroke="#2a1a0e" stroke-width="2.2" points="120.0,340.0 156.9,322.0 193.8,304.1 230.8,286.2 267.7,268.5 304.6,250.9 341.5,233.6 378.5,216.6 415.4,199.8 452.3,183.4 489.2,167.4 526.2,151.8 563.1,136.7 600.0,122.1"/>
  <text x="606" y="124" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">y = sin&#952;</text>

  <!-- gap bracket at 30deg (px507): line_py 151? recompute at 30deg=0.524: line y=0.524 ->340-360*.524=151.4 ; sin .524=0.5->340-360*.5=160.1. Use px507. -->
  <line x1="507" y1="151.4" x2="507" y2="160.1" stroke="#6B3520" stroke-width="2.2"/>
  <line x1="503" y1="151.4" x2="511" y2="151.4" stroke="#6B3520" stroke-width="1"/>
  <line x1="503" y1="160.1" x2="511" y2="160.1" stroke="#6B3520" stroke-width="1"/>
  <text x="516" y="160" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#6B3520">error &#8776; &#952;&#179;/6</text>

  <!-- error rule box -->
  <rect x="150" y="120" width="248" height="74" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="164" y="142" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Relative error of sin&#952; &#8776; &#952; &#160;&#8776; &#160;&#952;&#178;/6</text>
  <text x="164" y="162" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">&#160;&#160;at 15&#176; &#8594; about 1%</text>
  <text x="164" y="182" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">&#160;&#160;at 5&#176; &#8594; about 0.1%</text>

  <text x="350" y="402" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">A controlled error that grows like &#952;&#178; &#8212; you decide whether that is small enough for the job.</text>
</svg>
