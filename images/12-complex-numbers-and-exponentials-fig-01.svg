<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A complex number in rectangular and polar form</title>
  <desc id="desc">The complex number z equals 3 plus 2 i drawn as an arrow in the complex plane from the origin to the point (3, 2). Dashed legs show the rectangular parts a equals 3 and b equals 2; an arc marks the argument theta; the arrow length is the modulus r equals the square root of 13.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowred" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#C8102E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">One number, two descriptions: z = 3 + 2i</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Rectangular (a, b) or polar (r, &#952;): a = r&#8201;cos&#952;, b = r&#8201;sin&#952;, r = &#8730;(a&#178; + b&#178;), &#952; = atan2(b, a).</text>

  <!-- complex plane: origin at (180,330). 1 unit = 65 px. Re right, Im up. -->
  <line x1="120" y1="330" x2="640" y2="330" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="380" x2="180" y2="90" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="644" y="334" font-family="'EB Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#2a1a0e">Re</text>
  <text x="172" y="88" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#2a1a0e">Im</text>

  <!-- ticks -->
  <text x="245" y="346" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">1</text>
  <text x="310" y="346" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">2</text>
  <text x="375" y="346" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">3</text>
  <text x="168" y="269" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">1</text>
  <text x="168" y="204" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">2</text>

  <!-- point z at (3,2): px = 180+3*65=375 ; py = 330-2*65=200 -->
  <!-- dashed rectangular legs -->
  <line x1="375" y1="330" x2="375" y2="200" stroke="#6B3520" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="180" y1="200" x2="375" y2="200" stroke="#6B3520" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="278" y="346" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#6B3520">a = 3</text>
  <text x="170" y="268" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#6B3520">b = 2</text>

  <!-- the arrow (red) -->
  <line x1="180" y1="330" x2="370" y2="204" stroke="#C8102E" stroke-width="2.4" marker-end="url(#arrowred)"/>
  <circle cx="375" cy="200" r="4.5" fill="#C8102E"/>
  <text x="384" y="196" font-family="'EB Garamond', Georgia, serif" font-size="12" font-weight="bold" fill="#C8102E">z = 3 + 2i</text>

  <!-- modulus label along arrow -->
  <text x="250" y="250" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#C8102E">r = &#8730;13</text>

  <!-- argument arc near origin -->
  <path d="M 230 330 A 50 50 0 0 0 211 297" fill="none" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="240" y="316" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">&#952; &#8776; 33.7&#176;</text>

  <!-- both forms boxed -->
  <rect x="430" y="250" width="230" height="78" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="445" y="274" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Rectangular:&#160; z = a + bi = 3 + 2i</text>
  <text x="445" y="296" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">Polar:&#160; z = r(cos&#952; + i&#8201;sin&#952;)</text>
  <text x="445" y="316" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">&#160;&#160;&#160;&#160;&#160;&#160;= &#8730;13&#8201;(cos&#8201;33.7&#176; + i&#8201;sin&#8201;33.7&#176;)</text>

  <text x="350" y="402" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">The same arrow read two ways: as horizontal-and-vertical parts, or as a length and a direction.</text>
</svg>
