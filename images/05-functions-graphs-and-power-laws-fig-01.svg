<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A catalog of four function shapes</title>
  <desc id="desc">Four mini-plots: a linear function (straight line, constant rate), a quadratic (parabola, constant acceleration), a power law (scaling), and an exponential (constant fractional change). Each is labeled with its physical fingerprint.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Four shapes, four physical fingerprints</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Most relationships in mechanics are built from these elementary forms; the shape of the curve is the physics.</text>

  <!-- Panel 1: linear (32-348 x, 80-240 y) origin per panel -->
  <!-- box -->
  <g>
    <text x="48" y="92" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">LINEAR  y = mx + b</text>
    <line x1="48" y1="220" x2="330" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="56" y1="228" x2="56" y2="104" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="56" y1="208" x2="318" y2="118" stroke="#C8102E" stroke-width="2"/>
    <text x="190" y="244" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">constant rate (slope m)</text>
  </g>

  <!-- Panel 2: quadratic (370-668) -->
  <g>
    <text x="386" y="92" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">QUADRATIC  y = ax²</text>
    <line x1="386" y1="220" x2="668" y2="220" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="394" y1="228" x2="394" y2="104" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- parabola y=ax^2 from x small: points -->
    <polyline points="394,218 420,214 446,205 472,190 498,168 524,140 544,114" fill="none" stroke="#C8102E" stroke-width="2"/>
    <text x="528" y="244" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">constant acceleration</text>
  </g>

  <!-- Panel 3: power law (32-348, 260-400) -->
  <g>
    <text x="48" y="272" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">POWER LAW  y = a xᵇ</text>
    <line x1="48" y1="392" x2="330" y2="392" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="56" y1="400" x2="56" y2="284" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- two power curves b>1 and b<1 (sqrt) -->
    <polyline points="56,390 80,386 108,378 140,364 176,342 212,312 240,286" fill="none" stroke="#C8102E" stroke-width="2"/>
    <polyline points="56,390 84,372 120,356 164,342 212,330 260,322 300,316" fill="none" stroke="#6B3520" stroke-width="1.5"/>
    <text x="246" y="300" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#C8102E">b &gt; 1</text>
    <text x="298" y="330" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#6B3520">b = ½</text>
    <text x="190" y="416" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">scaling: x×c → y×cᵇ</text>
  </g>

  <!-- Panel 4: exponential (370-668, 260-400) -->
  <g>
    <text x="386" y="272" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">EXPONENTIAL  y = a bˣ</text>
    <line x1="394" y1="392" x2="668" y2="392" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="402" y1="400" x2="402" y2="284" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- exponential curve -->
    <polyline points="402,388 430,384 458,377 486,366 514,348 538,322 558,290" fill="none" stroke="#C8102E" stroke-width="2"/>
    <text x="528" y="416" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">constant fractional change</text>
  </g>

  <text x="350" y="60" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#FFFFFF"> </text>
</svg>
