<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Euler's formula and the phasor that casts a cosine</title>
  <desc id="desc">On the left, the unit circle with a phasor arrow to the point e to the i theta, whose coordinates are cosine theta and sine theta. A dashed drop marks cosine theta on the real axis. On the right, the cosine curve plotted versus theta, with a tie-line showing that the phasor's horizontal shadow traces out the cosine.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowred" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#C8102E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="36" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">e&#8305;&#7984; = cos&#952; + i&#8201;sin&#952;: a cosine is the shadow of a rotating phasor</text>
  <text x="32" y="54" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">As &#952; advances, e&#8305;&#7984; circles the unit circle; its horizontal projection (the real part) traces out cos&#952;.</text>

  <!-- LEFT: unit circle center (175,200) r=85 -->
  <text x="175" y="86" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">UNIT CIRCLE</text>
  <circle cx="175" cy="200" r="85" fill="none" stroke="#D4D4D4" stroke-width="1.2"/>
  <!-- axes -->
  <line x1="70" y1="200" x2="290" y2="200" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="175" y1="305" x2="175" y2="95" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="294" y="204" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">Re</text>
  <text x="168" y="98" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">Im</text>

  <!-- phasor to 50deg: tip (229.6,134.9) cos=0.643 sin=0.766 -->
  <line x1="175" y1="200" x2="227" y2="137" stroke="#C8102E" stroke-width="2.4" marker-end="url(#arrowred)"/>
  <circle cx="229.6" cy="134.9" r="4" fill="#C8102E"/>
  <text x="236" y="130" font-family="'EB Garamond', Georgia, serif" font-size="11" font-weight="bold" fill="#C8102E">e&#8305;&#7984;</text>
  <text x="236" y="146" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#545454">(cos&#952;, sin&#952;)</text>

  <!-- angle arc -->
  <path d="M 215 200 A 40 40 0 0 0 200.7 169" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="215" y="185" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">&#952;</text>

  <!-- projection drop to Re axis: from tip down to (229.6,200) -->
  <line x1="229.6" y1="134.9" x2="229.6" y2="200" stroke="#545454" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="229.6" cy="200" r="3.5" fill="#2a1a0e"/>
  <text x="244" y="218" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#2a1a0e">cos&#952;</text>

  <!-- RIGHT: cosine curve. theta 0..2pi -> px 380..650, yc 200, amp 70 -->
  <text x="515" y="86" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">REAL-PART PROJECTION = cos&#952;</text>
  <line x1="365" y1="200" x2="660" y2="200" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="295" x2="380" y2="115" stroke="#2a1a0e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="662" y="216" font-family="'EB Garamond', Georgia, serif" font-size="11" font-style="italic" fill="#2a1a0e">&#952;</text>
  <text x="373" y="118" text-anchor="end" font-family="'EB Garamond', Georgia, serif" font-size="10" fill="#2a1a0e">cos&#952;</text>
  <text x="582" y="216" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">2&#960;</text>
  <text x="515" y="216" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">&#960;</text>

  <!-- cosine curve -->
  <polyline fill="none" stroke="#C8102E" stroke-width="2.2" points="380.0,130.0 386.8,130.9 393.5,133.4 400.2,137.6 407.0,143.4 413.8,150.5 420.5,158.9 427.2,168.2 434.0,178.4 440.8,189.0 447.5,200.0 454.2,211.0 461.0,221.6 467.8,231.8 474.5,241.1 481.2,249.5 488.0,256.6 494.8,262.4 501.5,266.6 508.2,269.1 515.0,270.0 521.8,269.1 528.5,266.6 535.2,262.4 542.0,256.6 548.8,249.5 555.5,241.1 562.2,231.8 569.0,221.6 575.8,211.0 582.5,200.0 589.2,189.0 596.0,178.4 602.8,168.2 609.5,158.9 616.2,150.5 623.0,143.4 629.8,137.6 636.5,133.4 643.2,130.9 650.0,130.0"/>

  <!-- tie-line: curve point at theta=50deg is (417.5,155); dashed vertical drop to axis, plus a guide tying it to the circle projection at same theta -->
  <circle cx="417.5" cy="155.0" r="4" fill="#C8102E"/>
  <line x1="417.5" y1="155.0" x2="417.5" y2="200" stroke="#545454" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- tie connecting the circle's Re-axis projection point to the curve point's foot, showing same θ -->
  <line x1="229.6" y1="200" x2="417.5" y2="200" stroke="#545454" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/>
  <text x="424" y="151" font-family="'EB Garamond', Georgia, serif" font-size="9" fill="#C8102E">same &#952;</text>

  <text x="350" y="334" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">cos&#952; = Re(e&#8305;&#7984;) and sin&#952; = Im(e&#8305;&#7984;). A complex exponent &#8722;&#947; + i&#969; would spiral inward &#8212; decay times oscillation.</text>
</svg>
