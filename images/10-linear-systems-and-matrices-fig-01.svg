<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A 2x2 linear system as two intersecting lines</title>
  <desc id="desc">The lines 3x plus 2y equals 12 and x minus y equals 1 plotted on x-y axes, crossing at the single point (2, 1), which is the simultaneous solution of the system.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Two equations, two lines — the solution is where they cross</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The system 3x + 2y = 12 and x − y = 1 is satisfied at exactly one point: (2, 1).</text>

  <!-- plot area: x from -1..6 maps to px 90..620 ; y from -1..6 maps to py 360..90 -->
  <!-- gridlines -->
  <g stroke="#D4D4D4" stroke-width="1">
    <line x1="90" y1="90" x2="90" y2="360"/>
    <line x1="165.7" y1="90" x2="165.7" y2="360"/>
    <line x1="241.4" y1="90" x2="241.4" y2="360"/>
    <line x1="317.1" y1="90" x2="317.1" y2="360"/>
    <line x1="392.9" y1="90" x2="392.9" y2="360"/>
    <line x1="468.6" y1="90" x2="468.6" y2="360"/>
    <line x1="544.3" y1="90" x2="544.3" y2="360"/>
    <line x1="620" y1="90" x2="620" y2="360"/>
    <line x1="90" y1="90" x2="620" y2="90"/>
    <line x1="90" y1="128.6" x2="620" y2="128.6"/>
    <line x1="90" y1="167.1" x2="620" y2="167.1"/>
    <line x1="90" y1="205.7" x2="620" y2="205.7"/>
    <line x1="90" y1="244.3" x2="620" y2="244.3"/>
    <line x1="90" y1="282.9" x2="620" y2="282.9"/>
    <line x1="90" y1="321.4" x2="620" y2="321.4"/>
    <line x1="90" y1="360" x2="620" y2="360"/>
  </g>

  <!-- axes (x=0 at px 165.7, y=0 at py 321.4) -->
  <line x1="165.7" y1="90" x2="165.7" y2="372" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="78" y1="321.4" x2="632" y2="321.4" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="636" y="325" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x</text>
  <text x="160" y="84" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">y</text>
  <!-- axis number ticks -->
  <text x="241.4" y="337" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">1</text>
  <text x="317.1" y="337" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">2</text>
  <text x="392.9" y="337" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">3</text>
  <text x="468.6" y="337" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">4</text>
  <text x="544.3" y="337" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">5</text>
  <text x="158" y="285" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">1</text>
  <text x="158" y="208" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">3</text>
  <text x="158" y="131" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#545454">5</text>

  <!-- Line 1: 3x + 2y = 12 -> y = 6 - 1.5x. at x=-1,y=7.5 (clip) ; use x=0,y=6 (px165.7,py90) to x=5,y=-1.5(clip). Plot from x=0(165.7,90) to x=5(544.3? y=-1.5 below). compute endpoints within box: at x=0 y=6 -> (165.7,90.0); at x=4.667 y=-1 ->(518.9,360). -->
  <line x1="165.7" y1="90" x2="518.9" y2="360" stroke="#6B3520" stroke-width="2"/>
  <text x="470" y="120" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#6B3520">3x + 2y = 12</text>

  <!-- Line 2: x - y = 1 -> y = x - 1. at x=-1,y=-2; box: at y=-1 x=0 ->(165.7,360); at x=6,y=5 ->(620,167.1). Use x=0,y=-1 (165.7,360) to x=6,y=5(620,167.1) -->
  <line x1="165.7" y1="360" x2="620" y2="167.1" stroke="#2a1a0e" stroke-width="2"/>
  <text x="556" y="158" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">x − y = 1</text>

  <!-- intersection at (2,1): px = 165.7 + 2*75.7 = 317.1 ; py = 321.4 - 1*38.57 = 282.8 -->
  <line x1="317.1" y1="321.4" x2="317.1" y2="282.8" stroke="#C8102E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="165.7" y1="282.8" x2="317.1" y2="282.8" stroke="#C8102E" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="317.1" cy="282.8" r="5.5" fill="#C8102E"/>
  <text x="328" y="278" font-family="'EB Garamond', Georgia, serif" font-size="12" font-weight="bold" fill="#C8102E">(2, 1) — solution</text>

  <text x="350" y="400" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="11" fill="#2a1a0e">The crossing is the one point where both equations hold at once.</text>
</svg>
