<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Projectile path: independent components and nonzero apex velocity</title>
  <desc id="desc">A parabolic projectile trajectory with velocity arrows at launch, apex, and descent. The horizontal component v-x stays constant throughout; the vertical component v-y shrinks to zero at the apex and grows again on descent. At the apex the velocity is purely horizontal, not zero.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8102E"/>
    </marker>
    <marker id="arrowbr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B3520"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">At the apex the velocity is horizontal, not zero</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Differentiating componentwise: vₓ = v₀cos θ is constant; gravity touches only v_y. The two motions are independent.</text>

  <!-- ground axis -->
  <line x1="70" y1="330" x2="630" y2="330" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="70" y1="340" x2="70" y2="90" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="636" y="334" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">x</text>
  <text x="64" y="90" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">y</text>

  <!-- parabola: launch (70,330) apex (350,140) land (630,330) -->
  <path d="M 70 330 Q 350 -50 630 330" fill="none" stroke="#C8102E" stroke-width="2"/>

  <!-- launch point velocity (both components) at (110,300) approx on curve -->
  <!-- launch arrow up-right -->
  <circle cx="110" cy="290" r="3.5" fill="#2a1a0e"/>
  <line x1="110" y1="290" x2="150" y2="290" stroke="#6B3520" stroke-width="2" marker-end="url(#arrowbr)"/>
  <line x1="110" y1="290" x2="110" y2="240" stroke="#C8102E" stroke-width="2" marker-end="url(#arrowred)"/>
  <line x1="110" y1="290" x2="150" y2="240" stroke="#2a1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="92" y="232" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">launch</text>

  <!-- apex velocity: at (350,140) purely horizontal -->
  <circle cx="350" cy="140" r="4.5" fill="#2a1a0e"/>
  <line x1="350" y1="140" x2="400" y2="140" stroke="#6B3520" stroke-width="2.5" marker-end="url(#arrowbr)"/>
  <text x="356" y="124" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#2a1a0e">apex: v_y = 0,  vₓ ≠ 0</text>

  <!-- descent velocity at (560,270): components horizontal + down -->
  <circle cx="560" cy="278" r="3.5" fill="#2a1a0e"/>
  <line x1="560" y1="278" x2="600" y2="278" stroke="#6B3520" stroke-width="2" marker-end="url(#arrowbr)"/>
  <line x1="560" y1="278" x2="560" y2="318" stroke="#C8102E" stroke-width="2" marker-end="url(#arrowred)"/>
  <line x1="560" y1="278" x2="600" y2="318" stroke="#2a1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="262" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#2a1a0e">descent</text>

  <!-- legend -->
  <rect x="120" y="350" width="460" height="56" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="136" y1="368" x2="166" y2="368" stroke="#6B3520" stroke-width="2"/>
  <text x="172" y="372" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">vₓ = v₀ cos θ  (constant — no horizontal force)</text>
  <line x1="136" y1="390" x2="166" y2="390" stroke="#C8102E" stroke-width="2"/>
  <text x="172" y="394" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">v_y = v₀ sin θ − g t  (decelerated by gravity, zero at apex)</text>
</svg>
