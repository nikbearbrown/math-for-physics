<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A power law straightens on log-log axes</title>
  <desc id="desc">Free-fall data, distance equals 4.9 t squared, plotted as log distance against log time gives a straight line. The input climbs two decades while the output climbs four, so the slope is 4 over 2 equals 2 — Galileo's time-squared exponent read off a straight line.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">"What is the exponent?" becomes "what is the slope?"</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">log y = b log x + log a. On log–log axes, a power law y = a xᵇ is a straight line of slope b.</text>

  <!-- axes: origin (110,330); x = log t (0..2), y = log d (0..5) -->
  <line x1="110" y1="330" x2="560" y2="330" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="110" y1="340" x2="110" y2="90" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="566" y="334" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">log₁₀ t</text>
  <text x="110" y="82" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">log₁₀ d</text>

  <!-- x ticks: 0,1,2 over 400px -> 200px/decade -->
  <line x1="110" y1="330" x2="110" y2="335" stroke="#2a1a0e" stroke-width="1"/>
  <text x="110" y="350" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">0</text>
  <line x1="310" y1="330" x2="310" y2="335" stroke="#2a1a0e" stroke-width="1"/>
  <text x="310" y="350" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">1</text>
  <line x1="510" y1="330" x2="510" y2="335" stroke="#2a1a0e" stroke-width="1"/>
  <text x="510" y="350" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">2</text>
  <!-- y ticks: 0..5 over 240px -> 48px/decade. log d values: 0.69,2.69,4.69 -->
  <line x1="105" y1="330" x2="110" y2="330" stroke="#2a1a0e" stroke-width="1"/>
  <text x="100" y="334" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">0</text>
  <line x1="105" y1="234" x2="110" y2="234" stroke="#2a1a0e" stroke-width="1"/>
  <text x="100" y="238" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">2</text>
  <line x1="105" y1="138" x2="110" y2="138" stroke="#2a1a0e" stroke-width="1"/>
  <text x="100" y="142" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="9" fill="#545454">4</text>

  <!-- data points: (logt, logd): (0,0.69)->y=330-0.69*48=296.9 ; (1,2.69)->x=310,y=330-2.69*48=200.9 ; (2,4.69)->x=510,y=330-4.69*48=104.9 -->
  <line x1="110" y1="297" x2="510" y2="105" stroke="#C8102E" stroke-width="2"/>
  <circle cx="110" cy="297" r="4" fill="#C8102E"/>
  <circle cx="310" cy="201" r="4" fill="#C8102E"/>
  <circle cx="510" cy="105" r="4" fill="#C8102E"/>
  <text x="120" y="293" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">t=1 s, d=4.9 m</text>
  <text x="318" y="197" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">t=10 s, d=490 m</text>
  <text x="430" y="100" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">t=100 s, d=49,000 m</text>

  <!-- slope triangle: run from (110,297) to (510,297) [2 decades], rise to (510,105) [4 decades] -->
  <line x1="110" y1="297" x2="510" y2="297" stroke="#6B3520" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="510" y1="297" x2="510" y2="105" stroke="#6B3520" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="314" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#6B3520">run = 2 decades</text>
  <text x="520" y="205" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#6B3520">rise = 4</text>

  <!-- slope box -->
  <rect x="585" y="150" width="84" height="90" fill="#F5EFE8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="627" y="176" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.06em" fill="#545454">SLOPE</text>
  <text x="627" y="206" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" fill="#2a1a0e">b = 4/2</text>
  <text x="627" y="230" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#C8102E">= 2</text>

  <text x="350" y="388" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">Slope carries the scaling (exponent 2); intercept log a = log 4.9 carries the scale (g/2).</text>
</svg>
