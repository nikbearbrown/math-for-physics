<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Position, velocity, and acceleration as successive slopes</title>
  <desc id="desc">Three stacked plots sharing a time axis: position x equals one-half g t squared is a parabola; its slope, velocity v equals g t, is a rising straight line; the slope of velocity, acceleration a equals g, is a flat constant line. Each panel is the slope of the one above.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="34" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Differentiate to descend: position → velocity → acceleration</text>
  <text x="32" y="50" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">Each curve is the slope of the one above it; the same machine applies at every level. Free fall, x = ½ g t².</text>

  <!-- Panel 1: x(t) parabola. y region 66-160 -->
  <line x1="120" y1="160" x2="560" y2="160" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="166" x2="120" y2="66" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="100" y="74" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">x(t)</text>
  <polyline points="120,158 180,156 240,150 300,140 360,126 420,108 480,86" fill="none" stroke="#C8102E" stroke-width="2"/>
  <text x="488" y="84" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">x = ½ g t²  (parabola)</text>

  <!-- arrow linking -->
  <line x1="590" y1="120" x2="590" y2="200" stroke="#6B3520" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="598" y="164" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#6B3520">slope</text>

  <!-- Panel 2: v(t) line. y region 200-280 -->
  <line x1="120" y1="280" x2="560" y2="280" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="286" x2="120" y2="196" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="100" y="204" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">v(t)</text>
  <line x1="120" y1="278" x2="480" y2="206" stroke="#C8102E" stroke-width="2"/>
  <text x="488" y="210" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">v = g t  (rising line)</text>

  <line x1="590" y1="240" x2="590" y2="320" stroke="#6B3520" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="598" y="284" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#6B3520">slope</text>

  <!-- Panel 3: a(t) constant. y region 320-390 -->
  <line x1="120" y1="390" x2="560" y2="390" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="396" x2="120" y2="306" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="100" y="314" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">a(t)</text>
  <text x="566" y="394" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">t</text>
  <line x1="120" y1="350" x2="480" y2="350" stroke="#C8102E" stroke-width="2"/>
  <text x="488" y="354" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#C8102E">a = g  (constant)</text>
  <line x1="120" y1="350" x2="120" y2="350" stroke="#545454" stroke-width="0"/>
  <text x="124" y="344" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="9" fill="#545454">g = 9.8 m/s²</text>
</svg>
