<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Resolving weight on an incline</title>
  <desc id="desc">A block on a ramp at angle theta. Its weight mg points straight down and resolves into a component mg sine theta down the slope (the driver) and mg cosine theta into the surface (the normal). The component along the direction the angle is measured from carries the cosine.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>
  <text x="32" y="40" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#2a1a0e">Which component gets the sine? Read it off the triangle</text>
  <text x="32" y="58" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">The down-slope (driving) component carries sin θ; the into-surface (normal) component carries cos θ.</text>

  <!-- ramp -->
  <polygon points="70,330 470,330 70,170" fill="#F5EFE8" stroke="#2a1a0e" stroke-width="1.2"/>
  <path d="M 430 330 A 40 40 0 0 0 414 314" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="406" y="322" text-anchor="end" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="13" fill="#2a1a0e">θ</text>

  <!-- block -->
  <g transform="translate(230,254) rotate(-21.8)">
    <rect x="-30" y="-26" width="60" height="46" fill="#6B3520"/>
  </g>

  <!-- weight vector mg straight down from block center (230,254) -->
  <line x1="230" y1="254" x2="230" y2="356" stroke="#2a1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="350" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">mg</text>

  <!-- down-slope component (red): direction along slope downhill. slope dir = (cos-21.8, sin... ) downhill is to the right-down: (cos(-21.8)=0.928, sin(21.8)=0.371) -> draw to (230+74, 254+30)=(304,284) -->
  <line x1="230" y1="254" x2="304" y2="284" stroke="#C8102E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="296" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#C8102E">mg sin θ</text>
  <text x="312" y="312" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">down the slope</text>

  <!-- into-surface (normal) component: perpendicular into ramp, pointing down-left into surface: normal-inward = (-sin21.8, +cos21.8)? Inward normal points down-into-ramp: (sin? ) Use (-0.371, +0.928) scaled -> from (230,254) to (230-44,254+74)=(186,328) hmm that's into ramp. -->
  <line x1="230" y1="254" x2="190" y2="354" stroke="#545454" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="352" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#545454">mg cos θ</text>
  <text x="120" y="368" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#545454">into surface</text>

  <!-- side panel: limits -->
  <rect x="500" y="120" width="168" height="200" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="516" y="146" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="10" letter-spacing="0.08em" fill="#545454">SANITY CHECK</text>
  <text x="516" y="176" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">θ → 0 (flat)</text>
  <text x="516" y="196" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">drive = mg sin 0 = 0</text>
  <text x="516" y="214" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">normal = mg cos 0 = mg</text>
  <line x1="516" y1="230" x2="652" y2="230" stroke="#D4D4D4" stroke-width="1"/>
  <text x="516" y="256" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="12" fill="#2a1a0e">θ → 90° (wall)</text>
  <text x="516" y="276" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">drive = mg (free fall)</text>
  <text x="516" y="294" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#545454">normal = 0</text>

  <text x="350" y="396" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#2a1a0e">The components rebuild the weight: (mg cos θ)² + (mg sin θ)² = (mg)². No mnemonic needed.</text>
</svg>
